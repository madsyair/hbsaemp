[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ===========================================================================
# Project metadata  (PEP 621)
# ===========================================================================
[project]
name        = "hbsaemp"
version     = "1.0.0"
description = "Hierarchical Bayesian Small Area Estimation — caret-style unified interface"
readme      = "README.md"
license     = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
authors     = [{ name = "hbsaemp Contributors" }]
keywords    = ["SAE", "HBSAE", "bayesian", "small area estimation", "MCMC"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# ---------------------------------------------------------------------------
# Version status:
#   1.0.0  — Bambi implementation: pip install "hbsaemp[bambi]"  ← current
#   2.0.0  — Spatial extension:    pip install "hbsaemp[spatial]" (planned)
# ---------------------------------------------------------------------------
# Core deps (all versions): numpy + pandas only — no MCMC required at import
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# pip install "hbsaemp[bambi]"   — v1 Bayesian modelling + GUI backend
bambi = [
    "bambi>=0.18.0",
    "pymc>=6.0.1",         # transitive via bambi (which pins no floor); fit() needs PyMC 6.0 semantics
    "arviz>=1.1.0",
    "arviz-plots>=1.1.0",  # imported directly in diagnostics/comparison.py
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
# pip install "hbsaemp[gui]"     — v1 Panel web dashboard
gui = [
    "panel>=1.3.0",
    "hvplot>=0.9.0",
    "openpyxl>=3.1.0",
]
# pip install "hbsaemp[spatial]" — v2+ spatial random effects
spatial = [
    "pymc>=6.0.1",
    "libpysal>=4.9.0",
]
# pip install "hbsaemp[dev]"     — development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipykernel>=6.0.0",
]
# pip install "hbsaemp[all]"     — everything
all = [
    "hbsaemp[bambi,gui,spatial,dev]",
]

[project.scripts]
# CLI entry point — equivalent to run_sae_app() in R hbsaems
hbsaemp-app = "hbsaemp.app:launch_app"

[project.urls]
Repository    = "https://github.com/hbsaemp/hbsaemp"
"Bug Tracker" = "https://github.com/hbsaemp/hbsaemp/issues"

# ===========================================================================
# Setuptools
# ===========================================================================
[tool.setuptools.packages.find]
where   = ["."]
include = ["hbsaemp*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
hbsaemp = ["py.typed", "data/*.csv"]

# ===========================================================================
# Tool configuration
# ===========================================================================
[tool.pytest.ini_options]
testpaths     = ["tests"]
addopts       = "-v --tb=short --strict-markers"
log_cli       = true
log_cli_level = "WARNING"
markers = [
    "slow:    requires Bambi MCMC (v1). Skip with: pytest -m 'not slow'",
    "spatial: requires PyMC spatial (v2+). Skip with: pytest -m 'not spatial'",
    "gui:     requires Panel (v1). Skip with: pytest -m 'not gui'",
]

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle  F pyflakes  I isort  N pep8-naming  UP pyupgrade
# ANN type annotations  D Google docstrings
select = ["E", "F", "W", "I", "N", "UP", "ANN", "D"]
ignore = [
    "ANN401",  # `Any` is unavoidable at the Bambi/ArviZ boundary (no type hints upstream)
    "ANN003",  # **kwargs forwarding (subclass __init__ -> BaseModel) rides on ANN401
    "E501",    # line length is the formatter's job (same stance as PyMC & ArviZ)
    "D105",    # magic-method docstrings optional (same stance as PyMC)
    "D100", "D104", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Keep the `__init__.py` re-export hub's grouped `from m import (a as a, ...)`
# blocks instead of exploding them into one statement per name.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*"                       = ["ANN", "D"]
# F401: this is the re-export hub. UP036: the Python-version guard must mirror
# `requires-python` and is deliberate, not an outdated version block.
"hbsaemp/__init__.py"           = ["F401", "UP036"]
# `D` is the Fay-Herriot sampling-variance symbol, not a stray uppercase var.
# `_family_spec.py` now hosts the per-family domain checks/transforms (incl. the
# Gaussian FH `D`), moved here as the single source of family behavior.
"hbsaemp/data/_validator.py"    = ["N806"]
"hbsaemp/data/_preprocessor.py" = ["N806"]
"hbsaemp/data/datasets.py"      = ["N806"]
"hbsaemp/models/_family_spec.py" = ["N806"]

[tool.mypy]
python_version        = "3.12"
warn_return_any       = true
disallow_untyped_defs = true
no_implicit_optional  = true

[[tool.mypy.overrides]]
module = ["bambi.*", "pymc.*", "arviz.*", "pytensor.*", "libpysal.*",
          "panel.*", "hvplot.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["hbsaemp"]
omit   = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __repr__",
]
