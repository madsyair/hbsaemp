[build-system]
# `wheel` is not listed: setuptools.build_meta pulls it in itself (setuptools 70+).
# The >=77 floor is what makes the SPDX `license` string below legal.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# ===========================================================================
# Project metadata  (PEP 621)
# ===========================================================================
[project]
name        = "hbsaemp"
description = "Hierarchical Bayesian Small Area Estimation — caret-style unified interface"
readme      = "README.md"
license     = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors     = [{ name = "hbsaemp Contributors" }]
keywords    = ["SAE", "HBSAE", "bayesian", "small area estimation", "MCMC"]
# The version lives in hbsaemp/__init__.py alone — see [tool.setuptools.dynamic].
dynamic     = ["version"]
# No `License ::` classifier: PEP 639 supersedes it with the `license` field
# above, and setuptools rejects the two together.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Version status:
#   1.0.0  — Bambi implementation: pip install "hbsaemp[bambi]"  ← current
#   2.0.0  — Spatial extension:    pip install "hbsaemp[spatial]" (planned)
# ---------------------------------------------------------------------------
# Core deps (all versions): numpy + pandas only — no MCMC required at import
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# pip install "hbsaemp[bambi]"   — v1 Bayesian modelling + GUI backend
bambi = [
    "bambi>=0.18.0",
    # Direct import, not merely transitive: diagnostics/comparison.py calls
    # pm.stats.compute_log_prior for prior sensitivity. fit() also needs PyMC
    # 6.0 semantics (post-sampling compute_log_likelihood), and Bambi pins no
    # PyMC floor of its own.
    "pymc>=6.0.1",
    # Floor is 1.2, not 1.1: az.bayes_factor returns an xarray Dataset with a
    # "bf_type" dim from arviz-stats 1.2.0 on (1.1.x returned a nested dict),
    # and comparison.py reads only the newer shape.
    "arviz>=1.2.0",
    "arviz-plots>=1.2.0",  # imported directly by diagnostics/prior_check.py and app/
    "matplotlib>=3.8.0",   # diagnostics/_plot_utils.py captures ArviZ figures
]
# pip install "hbsaemp[gui]"     — v1 Panel web dashboard
# The dashboard fits models (model.fit()), so it needs the whole modelling
# stack, not just Panel — hence the self-reference to [bambi].
gui = [
    "hbsaemp[bambi]",   # bambi, pymc, arviz, arviz-plots, matplotlib
    "panel>=1.3.0",
    "param>=2.0",       # imported directly by app/_app.py and every tab
    "dcor>=0.6",        # explore_tab: distance correlation
    "seaborn>=0.13.0",  # explore_tab: the package's only seaborn consumer
    "scipy>=1.15.0",    # explore_tab: scipy.stats.chatterjeexi (added in SciPy 1.15)
]
# pip install "hbsaemp[spatial]" — v2+ spatial random effects
spatial = [
    "pymc>=6.0.1",
    "libpysal>=4.9.0",
]
# pip install "hbsaemp[dev]"     — development tooling only. Pair it with
# [bambi] or [gui] to actually run the suite. The Sphinx toolchain is pinned
# separately in docs/requirements-docs.txt.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipykernel>=6.0.0",
    "xarray>=2023.6.0",  # tests/test_v0_comparison_args.py builds idata stubs directly
]
# pip install "hbsaemp[all]"     — everything
all = [
    "hbsaemp[bambi,gui,spatial,dev]",
]

[project.scripts]
# CLI entry point — equivalent to run_sae_app() in R hbsaems. Needs the [gui]
# extra; a base install has no Panel to serve.
hbsaemp-app = "hbsaemp.app:launch_app"

[project.urls]
Documentation = "https://madsyair.github.io/hbsaemp/"
Repository    = "https://github.com/madsyair/hbsaemp"
"Bug Tracker" = "https://github.com/madsyair/hbsaemp/issues"

# ===========================================================================
# Setuptools
# ===========================================================================
[tool.setuptools.dynamic]
# Read statically from the AST, so the build backend never imports hbsaemp —
# which matters because an isolated build env has no numpy or pandas.
version = { attr = "hbsaemp.__version__" }

[tool.setuptools.packages.find]
include = ["hbsaemp*"]

[tool.setuptools.package-data]
# PEP 561 marker, plus the real datasets (REAL_DATASETS) that load_dataset()
# reads from disk. The synthetic ones are generated in code and need no file.
hbsaemp = ["py.typed", "data/*.csv"]

# ===========================================================================
# Tool configuration
# ===========================================================================
[tool.pytest.ini_options]
testpaths     = ["tests"]
addopts       = "-v --tb=short --strict-markers"
log_cli       = true
log_cli_level = "WARNING"
markers = [
    "slow:    requires Bambi MCMC (v1). Skip with: pytest -m 'not slow'",
    "spatial: requires PyMC spatial (v2+). Skip with: pytest -m 'not spatial'",
    "gui:     requires Panel (v1). Skip with: pytest -m 'not gui'",
]

[tool.ruff]
# `target-version` is deliberately absent: ruff infers py312 from
# `requires-python`, so there is one less place to keep in sync.
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle  F pyflakes  I isort  N pep8-naming  UP pyupgrade
# ANN type annotations  D Google docstrings
select = ["E", "F", "W", "I", "N", "UP", "ANN", "D"]
ignore = [
    "ANN401",  # `Any` is unavoidable at the Bambi/ArviZ boundary (no type hints upstream)
    # No formatter is wired up (no `ruff format` in pre-commit or CI), so
    # `line-length` above is advisory rather than enforced.
    "E501",
    "D105",    # magic-method docstrings optional (same stance as PyMC)
    "D104", "D107",  # only app/ relies on these; the backend documents both
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Keep the `__init__.py` re-export hub's grouped `from m import (a as a, ...)`
# blocks instead of exploding them into one statement per name.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*"                        = ["ANN", "D"]
# The Python-version guard mirrors `requires-python` and is deliberate, not an
# outdated version block.
"hbsaemp/__init__.py"            = ["UP036"]
# `D` is the Fay-Herriot sampling-variance symbol, not a stray uppercase var.
"hbsaemp/data/datasets.py"       = ["N806"]
"hbsaemp/models/_family_spec.py" = ["N806"]

[tool.coverage.run]
source = ["hbsaemp"]

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __repr__",
]
