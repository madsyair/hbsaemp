name: docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:00 UTC — only the linkcheck job runs on this trigger.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push to the same pull request supersedes the build still running for
# it, so that run is cancelled. Runs on main are never cancelled: one of them
# may be deploying, and a cancelled deployment can leave the live site in a
# half-updated state.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.12 is the package's declared floor (`requires-python = ">=3.12"`).
      # Building on the floor proves the floor is honest; newer versions then
      # follow for free.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # uv installs the same packages as pip, several times faster, and caches
      # the downloaded wheels between runs.
      - uses: astral-sh/setup-uv@v10

      # PyTensor compiles C extensions on first use and caches them here.
      # Without this the cost is paid again on every single run.
      - name: Cache PyTensor compiledir
        uses: actions/cache@v5
        with:
          path: ~/.pytensor
          key: pytensor-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: pytensor-${{ runner.os }}-py3.12-

      # The [bambi] extra is required from v0.2 on: the notebooks are executed
      # on every build, so the tutorials genuinely sample rather than being
      # rendered as dead text.
      - name: Install package and documentation toolchain
        run: uv pip install --system -e ".[bambi]" -r docs/requirements-docs.txt

      # Executed notebooks are kept between runs. jupyter-cache re-runs a
      # notebook whose code changed, but it cannot see what the code calls, so
      # the key also covers the package (the GUI excepted), its declared
      # dependencies and the ISO week: a change to any of them starts from an
      # empty cache and every notebook runs again. The week bounds how long a
      # new release of an unpinned dependency can go unnoticed. The run id
      # makes each run save its own cache; restore-keys picks the newest one.
      - name: Compute notebook cache key
        id: nbkey
        run: echo "prefix=notebooks-$(date -u +%G-%V)-${{ hashFiles('hbsaemp/**', '!hbsaemp/app/**', 'pyproject.toml', 'docs/requirements-docs.txt') }}-" >> "$GITHUB_OUTPUT"

      - name: Cache executed notebooks
        uses: actions/cache@v5
        with:
          path: docs/_build/.jupyter_cache
          key: ${{ steps.nbkey.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.nbkey.outputs.prefix }}

      # Builds the English site into docs/_build/html and the Indonesian one
      # into its id/ folder, both with -W (every warning is an error;
      # --keep-going has been the default since Sphinx 8.1). Only notebooks
      # missing from the cache are executed, in ipykernel, whose inline
      # matplotlib backend needs no display; the Indonesian build reuses the
      # results.
      - name: Build documentation
        run: python docs/i18n.py build

      # `actions/configure-pages` is deliberately not used. It only supplies a
      # base path for generators that need one, which Sphinx does not, and it
      # fails until Pages has been switched on in Settings. Leaving it out
      # keeps this job green on pull requests from the very first run.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  # Runs the `testcode` blocks. The how-to pages that sample are notebooks,
  # executed and checked by `build`, so notebook execution is switched off here
  # rather than paid for twice. A `testcode` block that still samples is shrunk
  # by `doctest_global_setup` in conf.py to 100 draws after 300 tuning steps on
  # 2 chains: this proves the call works, not that the draws converge.
  doctest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Plots drawn outside Jupyter need a backend that works without a display.
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
      # The sampling blocks compile models too; same cache as `build`.
      - name: Cache PyTensor compiledir
        uses: actions/cache@v5
        with:
          path: ~/.pytensor
          key: pytensor-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: pytensor-${{ runner.os }}-py3.12-
      - name: Install package and documentation toolchain
        run: uv pip install --system -e ".[bambi]" -r docs/requirements-docs.txt
      - name: Run documentation doctests
        run: sphinx-build -b doctest -D nb_execution_mode=off docs/source docs/_build/doctest

  # Deliberately not a pull-request gate: a third-party site being down is not
  # a reason to block a merge. Weekly, plus on demand.
  linkcheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
      - name: Install package and documentation toolchain
        run: uv pip install --system -e ".[bambi]" -r docs/requirements-docs.txt
      - name: Check external links
        run: sphinx-build -b linkcheck -D nb_execution_mode=off docs/source docs/_build/linkcheck

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never let two Pages deployments run at once, and never cancel one midway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
